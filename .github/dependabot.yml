# Update the source lockfile, not its generated requirements.txt export.
# Dependabot reads this configuration from the default branch, even though
# its update PRs target development. Keep the two copies synchronized.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    target-branch: development
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    groups:
      actions-minor-patch:
        patterns: ["*"]
        update-types: [minor, patch]
  - package-ecosystem: uv
    directory: /docs
    target-branch: development
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    allow:
      - dependency-type: all
    groups:
      docs-minor-patch:
        patterns: ["*"]
        update-types: [minor, patch]
  - package-ecosystem: npm
    directory: /
    target-branch: development
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    groups:
      core-minor-patch:
        patterns: ["*"]
        update-types: [minor, patch]
