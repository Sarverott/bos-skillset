# yaml-language-server: $schema=https://taskfile.dev/schema.json
# Checks of this repository. It holds no code: skills, manifests and docs.

version: '3'

includes:
  docs:
    taskfile: ./docs
    dir: ./docs

tasks:
  default:
    desc: list tasks
    cmds: [task --list]
    silent: true

  skills:
    desc: every skill an agent would install from here
    cmds: ['npx -y skills add . --list']

  plugin:
    desc: validate the Claude Code plugin and marketplace
    cmds: ['claude plugin validate .']

  check:
    desc: lock/export consistency, skills, plugin and a strict docs build
    cmds:
      - task: docs:check-lock
      - task: skills
      - task: plugin
      - task: docs:build
